name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: routing
        run: node tests/routing.test.mjs
      - name: store
        run: node tests/store.test.mjs
      - name: plugin
        run: node tests/plugin.test.mjs
